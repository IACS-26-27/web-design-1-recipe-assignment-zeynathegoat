<h2> Ingredients </h2>
<p> </p>

<ul>
 <li><label><input type="checkbox"> 1 cup (240g/ml) whole milk, warmed to about 110°F (43°C)</label></li>
 <li><label><input type="checkbox"> 2/3 cup (135g) granulated sugar, divided</label></li>
