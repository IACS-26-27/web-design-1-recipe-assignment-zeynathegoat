  <h1> Apple Cinnamon Roll Recipe</h1>
    <p style="color: #fffaf0"></color:> The perfect welcome - to fall breakfast. Destined to start your day off with a soft, sweet tooth.</p>

<h2> Ingredients </h2> 
<p> </p>
<h3 style = "color: #6c7a3a; " > </h3> 
<h3> Dough </h3> 
 <li><label><input type="checkbox"> 1 cup (240g/ml) whole milk, warmed to about 110°F (43°C)</label></li>
 <li><label><input type="checkbox"> 2/3 cup (135g) granulated sugar, divided</label></li>
<li> <label> <input type="checkbox"> 1 and 1/2 Tablespoons (14g) Platinum Yeast from Red Star (2 standard packets)*</label></li>
<li> <label> <input type="checkbox"> 1/2 cup (8 Tbsp; 113g) unsalted butter, softened to room temperature and cut into 4 pieces </label></li>
<li> <label> <input type= "checkbox"> 4 and 1/2 cups (563g) all- purpose flour or bread flour (spooned & leveled), plus more as needed </label></li>
<li> <label> <input type= "checkbox"> 2 large eggs, at room temperature </label></li>
<li> <label> <input type = "checkbox"> 1/2 teaspoon salt </label></li>
<li> <label> <input type= "checkbox"> 2 teaspoons oil or butter for the bowl (or use nonstick spray) </label></li>
<h3> Apple Cinnamon Filing </h3>
<li> <label> <input type= "checkbox"> 2 cups (250g) peeled chopped apples (about 2 medium apples) </label></li>
<li> <label> <input type= "checkbox"> 6 Tablespoons (85g) unsalted butter, softened to room temperature </label></li>
<li> <label> <input type= "checkbox"> 1/2 cup (100g) packed light or dark brown sugar </label></li>
<li> <label> <input type="checkbox"> 1 and 1/2 Tablespoons ground cinnamon </label>
<h3> Icing </h3>
<li> <label> <input type= "checkbox"> 1 cup (120g) confectioners’ sugar </label></li>
<li> <label> <input type= "checkbox"> 1/2 teaspoon pure vanilla extract </label></li>
<li> <label> <input type= "checkbox"> 2 Tablespoons milk </label></li>
<li> <label> <input type= "checkbox"> 2 Tablespoons warmed salted caramel </label></li>
<body>
<h1> Bake: (CAUTION:TIME-CONSUMING) </h1>
<li> <label> <input type="checkbox"> Prepare the dough: After the dough comes together in the mixing bowl, it’s time to knead. If you
have a stand mixer with a dough hook, you can use that for this step, or you can knead the dough by
hand.</label></li>
<li> <label> <input type="checkbox"> Let the dough rise: The dough rises in about 1–2 hours. During this time, you can get your filling
ingredients ready and quickly pre-cook the apples.</label></li>
<li> <label> <input type="checkbox"> Why pre-cook the apples? This extra 5-minute step makes a big difference. Over the years, some
readers have commented that the apples were still a bit crunchy after baking, so I added this brief
step to give them a head start. Simply cook the apples in a skillet with a splash of water until
they begin to soften. This helps ensure they’re perfectly tender by the time the cinnamon rolls are
baked through.</label></li>
<li> <label> <input type="checkbox"> Shape and fill the apple cinnamon rolls: Punch down the risen dough, then roll it into a 12×18-inch rectangle.</label></li>
<li> <label> <input type="checkbox"> Spread the butter on top and sprinkle evenly with the brown sugar and cinnamon. Scatter the
pre-cooked apples over the filling, tightly roll up the dough, and cut into 12 rolls.
</label></li>
<li> <label> <input type="checkbox"> Spread the butter on top and sprinkle evenly with the brown sugar and cinnamon. Scatter the
pre-cooked apples over the filling, tightly roll up the dough, and cut into 12 rolls.
</label></li>
<li> <label> <input type="checkbox"> Bake until the rolls are lightly browned. About halfway through the bake time, I like to cover the
rolls loosely with aluminum foil so the tops don’t brown too much before the centers have a chance
to bake through.</label></li>
<li> <label> <input type="checkbox">Drizzle with icing: Whisk all of the icing ingredients together and drizzle over the warm rolls.</label></li>
